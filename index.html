<!DOCTYPE html>
<!-- COMUNICACIÓN EJECUTIVA Aplicación personal de entrenamiento. Single-file HTML. -->
<!--
  Arquitectura (un único archivo, sin dependencias, sin build):
  - CSS: tokens en :root (claro/oscuro/auto), componentes, utilidades.
  - JS (vanilla ES2017+), secciones:
      CONFIG · COURSE_DATA · PRACTICE BANKS · RESOURCES · STATE · STORAGE (localStorage + IndexedDB)
      UTILITIES · ROUTER · COMPONENTS · EXERCISES · MEDIA · ANALYTICS LOCAL · VIEWS · INIT
  - Decisiones documentadas:
      · Navegación por hash (#/hoy…) para funcionar desde file:// sin servidor.
      · Progreso en localStorage; grabaciones en IndexedDB (los blobs no caben en localStorage).
      · Sin manifest ni service worker externos (requisito de archivo único). Metas para "Añadir a pantalla de inicio".
      · Vídeos: tarjeta con enlace externo y reproductor opcional cargado solo al pulsar (privacidad y offline).
      · Ningún dato sale del dispositivo. Sin analítica, sin cookies, sin APIs externas.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comunicación Ejecutiva · Entrenamiento</title>
<meta name="description" content="Curso personal de comunicación ejecutiva, oratoria, presencia institucional y reuniones. Funciona sin conexión; tus datos permanecen en este dispositivo.">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Comunicación">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F3A5F'/%3E%3Cpath d='M18 40V24h6l8 10 8-10h6v16h-6v-8l-8 9-8-9v8z' fill='%23F3E9D2'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231F3A5F'/%3E%3Cpath d='M50 114V66h17l23 28 23-28h17v48h-17V91l-23 26-23-26v23z' fill='%23F3E9D2'/%3E%3C/svg%3E">
<style>
/* =========================================================
   TOKENS
   ========================================================= */
:root{
  --bg:#F6F5F2; --bg2:#EFEDE8; --surface:#FFFFFF; --surface2:#F9F8F6; --line:#E3E0D9; --line2:#D3CFC6;
  --text:#17191D; --text2:#4B505A; --muted:#6B7079;
  --accent:#1F3A5F; --accent-ink:#FFFFFF; --accent-soft:#E6ECF4; --accent-2:#9A6B2F; --accent-2-soft:#F4ECDF;
  --ok:#2F6B4F; --ok-soft:#E3F0E8; --warn:#8A5A12; --warn-soft:#F8EEDC; --bad:#9B2C2C; --bad-soft:#F7E4E4;
  --c-serenidad:#4F7A8C; --c-estructura:#1F3A5F; --c-sintesis:#7A5C99; --c-criterio:#9A6B2F; --c-diplomacia:#3C7A5A; --c-direccion:#A0473F;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 4px 16px rgba(20,22,26,.06);
  --shadow-lg:0 10px 40px rgba(20,22,26,.16);
  --r:16px; --r-sm:12px; --r-lg:22px;
  --nav-h:64px; --top-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D0F12; --bg2:#14171B; --surface:#171A1F; --surface2:#1C2026; --line:#2A2F37; --line2:#363C46;
    --text:#ECEDEF; --text2:#B9BEC7; --muted:#8F95A0;
    --accent:#9DB8E0; --accent-ink:#0D1523; --accent-soft:#1E2A3B; --accent-2:#D6AE74; --accent-2-soft:#2E2618;
    --ok:#7CC39C; --ok-soft:#183026; --warn:#E2B567; --warn-soft:#2F2614; --bad:#E58C8C; --bad-soft:#3A1E1E;
    --c-serenidad:#7FB0C4; --c-estructura:#9DB8E0; --c-sintesis:#B79AD6; --c-criterio:#D6AE74; --c-diplomacia:#7CC39C; --c-direccion:#E09A92;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0F12; --bg2:#14171B; --surface:#171A1F; --surface2:#1C2026; --line:#2A2F37; --line2:#363C46;
  --text:#ECEDEF; --text2:#B9BEC7; --muted:#8F95A0;
  --accent:#9DB8E0; --accent-ink:#0D1523; --accent-soft:#1E2A3B; --accent-2:#D6AE74; --accent-2-soft:#2E2618;
  --ok:#7CC39C; --ok-soft:#183026; --warn:#E2B567; --warn-soft:#2F2614; --bad:#E58C8C; --bad-soft:#3A1E1E;
  --c-serenidad:#7FB0C4; --c-estructura:#9DB8E0; --c-sintesis:#B79AD6; --c-criterio:#D6AE74; --c-diplomacia:#7CC39C; --c-direccion:#E09A92;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}

/* =========================================================
   BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden;min-height:100vh;min-height:100dvh}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:1.65rem;font-weight:700}
h2{font-size:1.3rem;font-weight:650}
h3{font-size:1.08rem;font-weight:650}
p{margin:0 0 .8em}
a{color:var(--accent)}
ul,ol{margin:.2em 0 .8em;padding-left:1.25em}
li{margin:.2em 0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
.section-title a{display:inline-block;padding:12px 6px;margin:-12px -6px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:10px}
.skip:focus{top:8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* =========================================================
   LAYOUT
   ========================================================= */
.topbar{position:sticky;top:0;z-index:20;height:calc(var(--top-h) + var(--safe-t));padding:var(--safe-t) 8px 0 16px;
  display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar .brand{font-weight:650;font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:18px;height:18px}
main{overflow-wrap:break-word;max-width:680px;margin:0 auto;padding:12px 16px calc(var(--nav-h) + var(--safe-b) + 28px)}
body.focus main{padding-bottom:calc(var(--safe-b) + 110px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);
  padding-bottom:var(--safe-b)}
.tabbar ul{list-style:none;margin:0 auto;padding:0 4px;display:grid;grid-template-columns:repeat(5,1fr);max-width:680px;height:var(--nav-h)}
.tabbar li{margin:0}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;min-height:44px;
  text-decoration:none;color:var(--muted);font-size:.68rem;font-weight:600;letter-spacing:.02em;border-radius:12px}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}
.tabbar a[aria-current="page"] .tb-ic{background:var(--accent-soft)}
.tb-ic{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
body.focus .tabbar{display:none}
body.focus .topbar{display:none}

/* =========================================================
   COMPONENTS
   ========================================================= */
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--text2);flex:none}
.icon-btn:active{background:var(--bg2)}
.icon-btn svg{width:22px;height:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;border:1px solid var(--line2);
  background:var(--surface);color:var(--text);font-weight:600;font-size:1rem;text-decoration:none;transition:transform .08s,background .15s;text-align:center;line-height:1.2}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.accent2{background:var(--accent-2);color:#fff;border-color:var(--accent-2)}
:root[data-theme="dark"] .btn.accent2{color:#1a1206}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.block{display:flex;width:100%}
.btn.lg{min-height:56px;font-size:1.06rem;border-radius:16px}
.btn.sm{min-height:44px;padding:8px 14px;font-size:.92rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.card.flat{box-shadow:none}
.card.tint{background:var(--accent-soft);border-color:transparent;box-shadow:none}
.card.tint2{background:var(--accent-2-soft);border-color:transparent;box-shadow:none}
.card.hero{background:linear-gradient(160deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 78%,#000) 100%);color:var(--accent-ink);border:0}
.card.hero .eyebrow,.card.hero .muted{color:color-mix(in srgb,var(--accent-ink) 75%,transparent)}
.card.hero .btn.primary{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.card-link{display:block;text-decoration:none;color:inherit;width:100%;text-align:left;font:inherit;cursor:pointer}
.card-link:active{transform:scale(.995)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.xs{font-size:.78rem}
.center{text-align:center}
.mt0{margin-top:0}.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb0{margin-bottom:0}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.section-title h2{margin:0;font-size:1.12rem}
.page-head{margin:6px 2px 16px}
.page-head h1{margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--bg2);color:var(--text2);font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill svg{width:14px;height:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);color:var(--text2);font-weight:600;font-size:.9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.progress{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.progress.thin{height:5px}
.list{list-style:none;padding:0;margin:0}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);min-height:60px;text-decoration:none;color:inherit;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font:inherit}
.list li:last-child .list-item{border-bottom:0}
.list-item .chev,svg.chev{color:var(--muted);width:20px;height:20px;flex:none}
.li-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.li-icon svg{width:21px;height:21px}
.li-icon.done{background:var(--ok-soft);color:var(--ok)}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;justify-content:space-between;min-height:108px;padding:14px;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;box-shadow:var(--shadow);text-align:left;font:inherit;width:100%}
.tile:active{transform:scale(.98)}
.tile .li-icon{width:36px;height:36px}
.tile b{font-size:.98rem;line-height:1.25}
.tile span{font-size:.8rem;color:var(--muted);line-height:1.3}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-size:.85rem;font-weight:650;color:var(--text2);margin:0 0 6px}
.input,textarea.input,select.input{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);font-size:1rem;line-height:1.45}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.search .input{padding-left:44px}
.quote{overflow-wrap:anywhere;font-family:var(--serif);font-size:1.12rem;line-height:1.5;padding:14px 16px;border-left:3px solid var(--accent-2);background:var(--surface2);border-radius:0 12px 12px 0;margin:8px 0 12px}
.model{background:var(--ok-soft);border-radius:12px;padding:14px;margin:8px 0}
.model .eyebrow{color:var(--ok)}
.from{background:var(--bad-soft);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--text)}
.from .eyebrow{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.92rem}
.kv dt{color:var(--muted);font-weight:650}
.kv dd{margin:0}
.steps-ol{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps-ol li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.steps-ol li:last-child{border-bottom:0}
.steps-ol li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;opacity:.6;margin-bottom:6px}
.divider{height:1px;background:var(--line);margin:16px 0}
details.disc{border:1px solid var(--line);border-radius:12px;padding:0 14px;margin:8px 0;background:var(--surface)}
details.disc summary{min-height:48px;display:flex;align-items:center;font-weight:650;cursor:pointer;list-style:none}
details.disc summary::-webkit-details-marker{display:none}
details.disc summary::after{content:"+";margin-left:auto;font-size:1.3rem;color:var(--muted)}
details.disc[open] summary::after{content:"–"}
details.disc[open]{padding-bottom:12px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--text);font-size:.92rem;margin:8px 0}
.notice svg{width:20px;height:20px;flex:none;color:var(--warn);margin-top:1px}
.notice.info{background:var(--accent-soft)}
.notice.info svg{color:var(--accent)}
.notice.ok{background:var(--ok-soft)}
.notice.ok svg{color:var(--ok)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600;font-size:.92rem;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.comp-tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:650;color:var(--text2)}
.fav{width:44px;height:44px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:12px;flex:none}
.fav[aria-pressed="true"]{color:var(--accent-2)}
.fav svg{width:22px;height:22px}

/* Rich text from data */
.rt p:last-child{margin-bottom:0}
.rt strong{font-weight:700}

/* =========================================================
   LESSON PLAYER
   ========================================================= */
.lp-top{position:sticky;top:0;z-index:25;background:var(--bg);padding:calc(var(--safe-t) + 6px) 0 10px;margin:-12px -16px 8px;padding-left:8px;padding-right:16px}
.lp-top .row{gap:6px}
.lp-title{font-size:.86rem;font-weight:650;color:var(--text2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-step{animation:fadeUp .28s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lp-kind{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);margin-bottom:8px}
.lp-kind svg{width:16px;height:16px}
.lp-block{margin:0 0 14px}
.lp-block h4{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.lp-foot{position:fixed;left:0;right:0;bottom:0;z-index:26;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.lp-foot .inner{max-width:680px;margin:0 auto;display:flex;gap:10px}
.lp-foot .btn{flex:1}
.lp-foot .btn.back{flex:0 0 56px;padding:0}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);margin:0 0 10px;min-height:52px;font-size:.98rem;line-height:1.4}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--text)}
.feedback{padding:12px 14px;border-radius:12px;margin-top:4px;font-size:.95rem}
.feedback.ok{background:var(--ok-soft)}
.feedback.no{background:var(--warn-soft)}
.check3{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.check3:last-child{border-bottom:0}
.check3 .seg{grid-auto-columns:minmax(52px,1fr)}
.check3 .seg button{min-height:44px;font-size:.84rem;padding:0 6px}

  competencies:['serenidad','estructura','sintesis','criterio','diplomacia','direccion'], minutes:45,

        { t:'concept', title:'Un entrenamiento, no un temario', what:'Cada lección sigue el mismo ciclo: **concepto → ejemplo → microejercicio → práctica → grabación → autoevaluación → aplicación real**.', why:'La comunicación mejora con repeticiones deliberadas y revisión, igual que cualquier habilidad motora o cognitiva. Leer sobre oratoria no cambia cómo hablas.', how:'- Sesiones de 15-30 minutos.\n- Unos 3/4 del tiempo practicando.\n- Grábate siempre que puedas y escúchate después.', example:'Una lección típica: 2 pantallas de teoría, un mini quiz, un ejercicio cronometrado, una grabación de 60 s y un reto para tu próxima reunión.' },

  { q:'¿Esto es una opinión o un hecho?', why:'Pone a prueba tu criterio.', structure:['Clasificar','Hecho','Interpretación'], model:'Es una interpretación basada en un hecho. El hecho es que las ventas en el canal digital han bajado un 12 %. Mi interpretación es que se debe al cambio de la web, pero aún no lo hemos confirmado.' },

const clamp = (n, a, b) => Math.max(a, Math.min(b, n));

const dayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* Texto enriquecido mínimo: **negrita**, saltos de línea y listas "- " */
function rt(s) {
  if (!s) return '';
  const lines = String(s).split('\n');
  let html = '', list = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  lines.forEach(l => {
    const t = l.trim();
    if (/^[-•]\s+/.test(t)) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + inline(t.replace(/^[-•]\s+/, '')) + '</li>'; }
    else { if (list) { html += '</ul>'; list = false; } if (t) html += '<p>' + inline(t) + '</p>'; }
  });
  if (list) html += '</ul>';
  return '<div class="rt">' + html + '</div>';
}

const Store = {
  ok: (() => { try { const k = '__t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  load() { if (!this.ok) return null; try { return JSON.parse(localStorage.getItem(CONFIG.storageKey) || 'null'); } catch (e) { return null; } },
  save(obj) { if (!this.ok) return false; try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(obj)); return true; } catch (e) { toast('No se pudo guardar: almacenamiento lleno o bloqueado'); return false; } },
  clear() { if (this.ok) try { localStorage.removeItem(CONFIG.storageKey); } catch (e) {} }
};
const DB = {
  db: null, failed: false, mem: new Map(),
  open() {
    if (this.db || this.failed) return Promise.resolve(this.db);
    return new Promise(res => {
      try {
        if (!window.indexedDB) { this.failed = true; return res(null); }
        const rq = indexedDB.open(CONFIG.dbName, 1);
        rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('recs')) d.createObjectStore('recs', { keyPath:'id' }); };
        rq.onsuccess = () => { this.db = rq.result; res(this.db); };
        rq.onerror = () => { this.failed = true; res(null); };
        rq.onblocked = () => { this.failed = true; res(null); };
      } catch (e) { this.failed = true; res(null); }
    });
  },
  async tx(mode, fn) {
    const d = await this.open();
    if (!d) return fn(null);
    return new Promise((res, rej) => {
      try { const t = d.transaction('recs', mode); const st = t.objectStore('recs'); const r = fn(st); t.oncomplete = () => res(r && r.result !== undefined ? r.result : r); t.onerror = () => rej(t.error); }
      catch (e) { rej(e); }
    });
  },
  async put(rec) { if (!(await this.open())) { this.mem.set(rec.id, rec); return; } return this.tx('readwrite', st => st.put(rec)); },
  async all() {
    if (!(await this.open())) return Array.from(this.mem.values());
    return new Promise(res => { try { const rq = this.db.transaction('recs').objectStore('recs').getAll(); rq.onsuccess = () => res(rq.result || []); rq.onerror = () => res([]); } catch (e) { res([]); } });
  },
  async get(id) {
    if (!(await this.open())) return this.mem.get(id);
    return new Promise(res => { try { const rq = this.db.transaction('recs').objectStore('recs').get(id); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); } catch (e) { res(null); } });
  },
  async del(id) { if (!(await this.open())) { this.mem.delete(id); return; } return this.tx('readwrite', st => st.delete(id)); },
  async clear() { if (!(await this.open())) { this.mem.clear(); return; } return this.tx('readwrite', st => st.clear()); }
};

/* =========================================================

   ========================================================= */
const A = {
  touch() {
    const now = Date.now();
    if (now - (S.lastActivity || 0) > CONFIG.sessionGapMin * 60000) S.sessions = (S.sessions || 0) + 1;
    S.lastActivity = now;
  },
  addTime(sec, practice) {
    sec = Math.max(0, Math.round(sec || 0));
    this.touch();
    const k = dayKey(); S.days[k] = (S.days[k] || 0) + sec;
    if (practice) S.practiceSec = (S.practiceSec || 0) + sec;
    save();
  },
  points(n) { S.points = (S.points || 0) + n; save(); },
  logExercise(e) {
    this.touch();
    S.exercises.push(Object.assign({ id: uid(), date: Date.now() }, e));
    if (S.exercises.length > 800) S.exercises = S.exercises.slice(-800);
    save(); Milestones.check();
  },
  streak() {
    let n = 0; const d = new Date();
    if (!S.days[dayKey(d)]) d.setDate(d.getDate() - 1);
    while (S.days[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
    return n;
  },
  weekDays() {
    const out = []; const d = new Date(); d.setDate(d.getDate() - 6);
    const names = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
    for (let i = 0; i < 7; i++) { out.push({ k: dayKey(d), lab: names[d.getDay()], sec: S.days[dayKey(d)] || 0, today: i === 6 }); d.setDate(d.getDate() + 1); }
    return out;
  },
  totalProgress() { return Math.round(100 * Object.keys(S.lessonsDone).filter(id => LESSON(id)).length / ALL_LESSONS.length); },
  weekProgress(w) { const n = w.lessons.filter(l => S.lessonsDone[l.id]).length; return { done: n, total: w.lessons.length, pct: Math.round(100 * n / w.lessons.length) }; },
  nextLesson() { return ALL_LESSONS.find(l => !S.lessonsDone[l.id]) || null; },
  realDone() { return Object.values(S.challenges).filter(c => c.done).length; },
  baseline() { return S.assessments.find(a => a.kind === 'baseline') || null; },
  final() { const f = S.assessments.filter(a => a.kind === 'final'); return f[f.length - 1] || null; },
  /* Puntuación actual: última autoevaluación (final o rápida); si no hay, media de las últimas prácticas puntuadas */
  current() {
    const ass = S.assessments.filter(a => a.kind !== 'baseline');
    if (ass.length) return { scores: ass[ass.length - 1].scores, src: 'Última autoevaluación · ' + fmtDate(ass[ass.length - 1].date) };
    const rated = Object.values(S.ratings).sort((a, b) => a.date - b.date).slice(-8);
    if (rated.length) return { scores: avgScores(rated.map(r => r.scores)), src: 'Media de tus últimas prácticas puntuadas' };
    const b = this.baseline(); if (b) return { scores: b.scores, src: 'Baseline inicial' };
    return null;
  },
  checklistStats(n) {
    const recent = S.exercises.filter(e => e.checklist).slice(-(n || 15));
    const st = {};
    recent.forEach(e => Object.entries(e.checklist).forEach(([k, v]) => { st[k] = st[k] || { si: 0, parcial: 0, no: 0, n: 0 }; st[k][v] = (st[k][v] || 0) + 1; st[k].n++; }));
    return st;
  }
};
function avgScores(list) {
  const out = {};
  CONFIG.comps.forEach(c => { const v = list.map(s => s && s[c.key]).filter(x => x > 0); out[c.key] = v.length ? Math.round(10 * v.reduce((a, b) => a + b, 0) / v.length) / 10 : 0; });
  return out;
}

function beep(freq, ms) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine'; o.frequency.value = freq || 660; g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (ms || 220) / 1000);

  } catch (e) {}
}

function radarSVG(series, size) {
  size = size || 300; const cx = size / 2, cy = size / 2 + 4, R = size / 2 - 52; const n = CONFIG.comps.length;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 5, cy + Math.sin(a) * R * v / 5]; };
  let g = '';
  for (let lv = 1; lv <= 5; lv++) g += '<polygon points="' + CONFIG.comps.map((c, i) => pt(i, lv).join(',')).join(' ') + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  CONFIG.comps.forEach((c, i) => { const [x, y] = pt(i, 5); g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + x + '" y2="' + y + '" stroke="var(--line)"/>'; const [lx, ly] = pt(i, 6.15); g += '<text x="' + lx + '" y="' + (ly + 4) + '" text-anchor="middle" style="font-weight:650;fill:var(--text2)">' + c.label + '</text>'; });
  series.forEach(s => {
    if (!s.scores) return;
    const pts = CONFIG.comps.map((c, i) => pt(i, s.scores[c.key] || 0).join(',')).join(' ');
    g += '<polygon points="' + pts + '" fill="' + s.color + '" fill-opacity="' + (s.fill || .14) + '" stroke="' + s.color + '" stroke-width="2.2"' + (s.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
    CONFIG.comps.forEach((c, i) => { const [x, y] = pt(i, s.scores[c.key] || 0); g += '<circle cx="' + x + '" cy="' + y + '" r="3" fill="' + s.color + '"/>'; });
  });
  const desc = series.filter(s => s.scores).map(s => s.label + ': ' + CONFIG.comps.map(c => c.label + ' ' + (s.scores[c.key] || 0)).join(', ')).join('. ');
  return '<svg class="chart" viewBox="0 0 ' + size + ' ' + (size + 8) + '" role="img" aria-label="Gráfico radar de competencias. ' + esc(desc) + '">' + g + '</svg>' +
    '<div class="legend">' + series.filter(s => s.scores).map(s => '<span><i style="background:' + s.color + '"></i>' + esc(s.label) + '</span>').join('') + '</div>';
}
function lineSVG(points) {
  const W = 340, H = 180, P = { l: 26, r: 10, t: 12, b: 26 };
  const n = points.length; if (n < 2) return '';
  const x = i => P.l + i * (W - P.l - P.r) / (n - 1), y = v => P.t + (5 - v) * (H - P.t - P.b) / 4;
  let g = '';
  for (let v = 1; v <= 5; v++) g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)"/><text x="6" y="' + (y(v) + 4) + '">' + v + '</text>';
  points.forEach((p, i) => { if (n <= 8 || i % Math.ceil(n / 6) === 0 || i === n - 1) g += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(p.lab) + '</text>'; });
  CONFIG.comps.forEach(c => {
    const d = points.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.scores[c.key] || 1).toFixed(1)).join(' ');
    g += '<path d="' + d + '" fill="none" stroke="' + compColor(c.key) + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    points.forEach((p, i) => g += '<circle cx="' + x(i) + '" cy="' + y(p.scores[c.key] || 1) + '" r="2.6" fill="' + compColor(c.key) + '"/>');
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolución de las seis competencias en ' + n + ' evaluaciones">' + g + '</svg>' +
    '<div class="legend">' + CONFIG.comps.map(c => '<span><i style="background:' + compColor(c.key) + '"></i>' + c.label + '</span>').join('') + '</div>';
}
function compBars(scores, base) {

   ========================================================= */
const Media = {
  stream: null, mr: null, chunks: [], mime: '', t0: 0,
  supported() { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
  pickMime(video) {
    const c = video ? ['video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'] : ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg'];
    try { for (const m of c) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; } catch (e) {}
    return '';
  },
  async start(video) {
    this.release();
    this.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true }, video: video ? { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } } : false });
    this.mime = this.pickMime(video);

    this.chunks = [];
    this.mr.ondataavailable = e => { if (e.data && e.data.size) this.chunks.push(e.data); };
    this.mr.start(1000); this.t0 = Date.now();
    return this.stream;
  },
  stop() {
    return new Promise(res => {
      if (!this.mr || this.mr.state === 'inactive') { this.release(); return res(null); }
      const dur = (Date.now() - this.t0) / 1000;
      this.mr.onstop = () => { const type = this.mr.mimeType || this.mime || (this.chunks[0] && this.chunks[0].type) || 'audio/webm'; const blob = new Blob(this.chunks, { type }); this.release(); res({ blob, dur, mime: type }); };
      try { this.mr.stop(); } catch (e) { this.release(); res(null); }
    });
  },
  release() { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; }
};
const NO_REC_MSG = 'Grabación no disponible en este navegador. Utiliza la grabadora del teléfono y vuelve después.';

function audTip(d) {
  const t = { 'Comité de dirección':'Poco tiempo y muchas interrupciones: conclusión en los primeros 30 segundos y datos preparados por si te los piden.', 'Consejo':'Visión de conjunto, riesgos y decisión. Evita el detalle operativo.', 'Cliente':'Habla de su problema y su beneficio, no de tu proceso.', 'Equipo':'Explica el porqué y qué cambia para cada persona.', 'Otras áreas':'Evita la jerga de tu área y muestra el interés común.', 'Público amplio':'Una idea, ejemplos concretos y una historia breve.' };
  return (t[d.aud] || '') + (d.know === 'bajo' ? ' Conocimiento bajo: define los términos y usa una comparación.' : d.know === 'alto' ? ' Conocimiento alto: ve directamente a lo nuevo y a lo discutible.' : '');
}
function pbScript(d) {
  const tot = d.dur * 60, o = Math.round(tot * .1), c = Math.round(tot * .15), each = Math.round((tot - o - c) / 3);
  const warn = [];
  if (!d.msg) warn.push('Falta el mensaje central.'); else if (words(d.msg) > 25) warn.push('El mensaje central supera las 25 palabras.');
  if (d.ideas.filter(i => i.t).length < 2) warn.push('Necesitas al menos 2 ideas de apoyo.');
  if (d.ideas.some(i => i.t && !i.e)) warn.push('Alguna idea no tiene evidencia.');
  if (!d.cta) warn.push('Falta la llamada a la acción: ¿qué quieres que haga la audiencia?');
  if (d.aud === 'Comité de dirección' && d.openType !== 'conclusion') warn.push('Ante un comité, considera abrir con la conclusión.');
  const txt = pbText(d);
  return (warn.length ? '<div class="notice">' + icon('warn') + '<span>' + warn.map(esc).join('<br>') + '</span></div>' : '<div class="notice ok">' + icon('check') + '<span>Estructura completa. Ahora, ensáyala en voz alta y grábate.</span></div>') +
    '<div class="card"><p class="eyebrow">Apertura · ' + fmtDur(o) + '</p><p>' + esc(d.open || PB_OPEN[d.openType].t(d)) + '</p><p class="eyebrow">Mensaje central</p><p style="font-family:var(--serif);font-size:1.15rem">' + esc(d.msg || '—') + '</p>' +
    d.ideas.map((it, j) => it.t ? '<p class="eyebrow">Idea ' + (j + 1) + ' · ' + fmtDur(each) + '</p><p class="mb8">' + esc(it.t) + '</p><p class="small muted">Evidencia: ' + esc(it.e || '—') + '</p>' : '').join('') +
    '<p class="eyebrow">Cierre · ' + fmtDur(c) + '</p><p class="mb8">' + esc(d.close || '—') + '</p><p><b>' + esc(d.cta || '—') + '</b></p>' +
    (d.qs ? '<p class="eyebrow">Preguntas previsibles</p><ul class="small">' + d.qs.split('\n').filter(Boolean).map(q => '<li>' + esc(q) + '</li>').join('') + '</ul><p class="xs muted">Prepara cada respuesta con Responder – Detallar – Valor.</p>' : '') + '</div>' +
    '<div class="btn-row"><button class="btn primary" data-act="pbRehearse">' + icon('mic') + 'Ensayar (' + d.dur + ' min)</button><button class="btn" data-act="pbCopy" data-txt="' + esc(txt) + '">Copiar guion</button></div><button class="btn soft block mt8" data-act="pbSave">Guardar presentación</button><button class="btn ghost block mt8" data-act="pbNew">Empezar una nueva</button>';
}
function pbText(d) {
  return 'PRESENTACIÓN: ' + d.tema + '\nAudiencia: ' + d.aud + ' · ' + d.dur + ' min\n\nAPERTURA\n' + (d.open || PB_OPEN[d.openType].t(d)) + '\n\nMENSAJE CENTRAL\n' + d.msg + '\n\n' + d.ideas.filter(i => i.t).map((i, j) => 'IDEA ' + (j + 1) + ': ' + i.t + '\n  Evidencia: ' + i.e).join('\n') + '\n\nCIERRE\n' + d.close + '\n' + d.cta + (d.qs ? '\n\nPREGUNTAS PREVISIBLES\n' + d.qs : '');

const FC_DAYS = [0, 1, 3, 7];
function fcDue(i) { const c = S.cards[i]; if (!c || !c.seen) return 0; return c.seen + FC_DAYS[Math.min(3, c.box || 0)] * 864e5; }

function fcOrder() {
  const L = BANK.flashcards.map((c, i) => ({ i, due: fcDue(i), box: (S.cards[i] || {}).box || 0 }));
  return L.sort((a, b) => a.due - b.due || a.box - b.box || a.i - b.i).map(x => x.i);
}

  const T = TimerX; T.left = (T.end - Date.now()) / 1000;

  if (t) t.textContent = fmtTime(Math.ceil(T.left)); if (r) r.style.strokeDashoffset = String(326.7 * (1 - T.left / T.total));
  if (s) s.textContent = T.running ? 'En marcha' : T.left <= 0 ? 'Tiempo' : 'En pausa';
  if (b && !T.running) b.innerHTML = icon('play') + (T.left > 0 && T.left < T.total ? 'Reanudar' : 'Iniciar');
}

function doExport() {

function mergeState(st) {
  const base = DEFAULT_STATE(), out = base;
  Object.keys(base).forEach(k => {
    const v = st[k], d = base[k]; if (v === undefined || v === null) return;
    if (Array.isArray(d)) { if (Array.isArray(v)) out[k] = v; }
    else if (typeof d === 'object' && d !== null) { if (typeof v === 'object' && !Array.isArray(v)) out[k] = v; }
    else if (d === null) out[k] = v;
    else if (typeof v === typeof d) out[k] = v;
  });
  out.assessments = out.assessments.filter(a => a && a.scores && typeof a.scores === 'object' && a.date);
  out.exercises = out.exercises.filter(e => e && typeof e === 'object');
  out.reflections = out.reflections.filter(r => r && r.answers && typeof r.answers === 'object');
  Object.keys(out.challenges).forEach(k => { if (!out.challenges[k] || typeof out.challenges[k] !== 'object') delete out.challenges[k]; });
  Object.keys(out.ratings).forEach(k => { if (!out.ratings[k] || typeof out.ratings[k].scores !== 'object') delete out.ratings[k]; });
  out.presentations = out.presentations.filter(p => p && p.d && Array.isArray(p.d.ideas));
  if (out.pbDraft && !(out.pbDraft.d && Array.isArray(out.pbDraft.d.ideas))) delete out.pbDraft;
  return out;
}
function doImport(file) {
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const d = JSON.parse(fr.result); const st = d && d.state ? d.state : d;
      if (!st || typeof st !== 'object' || !('lessonsDone' in st) || !Array.isArray(st.exercises)) throw new Error('formato');
      const ok = await confirmSheet('¿Importar progreso?', 'Se sustituirá el progreso actual de este dispositivo por el del archivo (' + Object.keys(st.lessonsDone).length + ' lecciones, ' + st.exercises.length + ' ejercicios).', 'Importar');
      if (!ok) return;
      S = mergeState(st); saveNow(); applyTheme(); toast('Progreso importado'); Router.go('#/progreso');
    } catch (e) { toast('El archivo no es un progreso válido'); }
  };
  fr.onerror = () => toast('No se pudo leer el archivo');
  fr.readAsText(file);
}

  fillReset() { UI.fill = 0; UI.fillTopic = null; rerender(); },
  fillTimer() { Practice.open({ title: 'Minuto sin muletillas', prompt: (UI.fillTopic || pick(BANK.improv)).q, extra: 'Después, cuenta las muletillas al escuchar la grabación y anótalas en el contador.', prep: 5, seconds: 60, checklist: ['pauses'], ctx: 'fillers', kind: 'voice', kindLabel: 'Muletillas', onDone: rerender }); },
  fillSave() { S.fillers = S.fillers || []; S.fillers.push({ date: Date.now(), n: UI.fill }); A.points(CONFIG.points.micro); A.logExercise({ kind: 'voice', ctx: 'fillers', title: 'Contador de muletillas', notes: UI.fill + ' muletillas' }); toast('Guardado: ' + UI.fill + (UI.fill === 1 ? ' muletilla' : ' muletillas')); UI.fill = 0; rerender(); },
  threeNext() { UI.three = pick(BANK.improv); rerender(); },
  threeGo() { Practice.open({ title: 'Respuesta a 3 segundos', prompt: UI.three.q, prep: 3, seconds: 30, checklist: ['pauses', 'headline'], ctx: 'three', kind: 'voice', kindLabel: 'Silencio obligatorio de 3 s', onDone: () => { UI.three = pick(BANK.improv); rerender(); } }); },
  /* Constructor */
  pbStep(el) { pbCollect(); save(); pbData().step = +el.dataset.v; rerender(); window.scrollTo(0, 0); },
  pbSet(el) { pbCollect(); pbData().d[el.dataset.k] = el.dataset.k === 'dur' ? +el.dataset.v : el.dataset.v; rerender(); },
  pbOpenTpl() { pbCollect(); const d = pbData().d; d.open = PB_OPEN[d.openType].t(d); rerender(); },
  pbRehearse() { const d = pbData().d; Practice.open({ title: 'Ensayo · ' + (d.tema || 'Presentación'), prompt: d.msg || d.tema, extra: '<ol class="small">' + d.ideas.filter(i => i.t).map(i => '<li>' + esc(i.t) + '</li>').join('') + '</ol><b>Cierre:</b> ' + esc(d.cta), prep: 15, seconds: d.dur * 60, structure: ['Apertura', 'Mensaje central', 'Tres ideas con evidencia', 'Cierre y petición'], checklist: ['headline', 'three', 'pauses', 'recommend'], ctx: 'pres', kind: 'presentation', kindLabel: 'Ensayo de presentación', onDone: rerender }); },
  pbCopy(el) { const t = el.dataset.txt; try { navigator.clipboard.writeText(t).then(() => toast('Guion copiado'), () => toast('No se pudo copiar')); } catch (e) { toast('No se pudo copiar'); } },
  pbSave() { const pb = pbData(); const id = pb.id || uid(); pb.id = id; S.presentations = S.presentations.filter(p => p.id !== id); S.presentations.push({ id, date: Date.now(), d: JSON.parse(JSON.stringify(pb.d)) }); A.points(CONFIG.points.practice); save(); toast('Presentación guardada'); rerender(); },
  pbLoad(el) { const p = S.presentations.find(x => x.id === el.dataset.id); if (p) { UI.pb = { step: 6, id: p.id, d: JSON.parse(JSON.stringify(p.d)) }; rerender(); window.scrollTo(0, 0); } },
  async pbDel(el) { const ok = await confirmSheet('¿Borrar presentación?', 'Se eliminará el esquema guardado.', 'Borrar', true); if (ok) { S.presentations = S.presentations.filter(p => p.id !== el.dataset.id); save(); rerender(); } },
  pbNew() { UI.pb = null; S.pbDraft = null; save(); rerender(); },
  /* Temporizador */
  tmSet(el) { const T = TimerX; clearInterval(T.iv); T.iv = null; T.running = false; UI.timerSec = +el.dataset.v; T.total = T.left = UI.timerSec; rerender(); },
  tmToggle() {
    const T = TimerX; const b = $('#tmBtn');
    if (T.running) { T.running = false; clearInterval(T.iv); T.iv = null; tmTick(); }
    else { if (T.left <= 0) T.left = T.total; T.end = Date.now() + T.left * 1000; T.running = true; T.iv = setInterval(tmTick, 250); tmTick(); if (b) b.innerHTML = icon('pause') + 'Pausa'; beep(880, 100); }
  },
  tmReset() { const T = TimerX; clearInterval(T.iv); T.iv = null; T.running = false; T.left = T.total; rerender(); },
  /* Progreso */
  qaRate(el) { UI.qa[el.dataset.k] = +el.dataset.v; segSet(el); },
  qaSave() { if (CONFIG.comps.some(c => !UI.qa[c.key])) return toast('Puntúa las seis competencias'); S.assessments.push({ kind: 'check', date: Date.now(), scores: Object.assign({}, UI.qa) }); A.touch(); save(); UI.qa = null; toast('Autoevaluación guardada'); Router.go('#/progreso'); },
  async recPlay(el) { const r = await DB.get(el.dataset.id); const slot = $('[data-recslot="' + el.dataset.id + '"]'); if (!r || !slot) return toast('Grabación no disponible'); const url = URL.createObjectURL(r.blob); slot.innerHTML = r.video ? '<video controls playsinline autoplay src="' + url + '"></video>' : '<audio controls autoplay src="' + url + '"></audio>'; },
  async recDel(el) { const ok = await confirmSheet('¿Borrar grabación?', 'Se eliminará de este dispositivo.', 'Borrar', true); if (ok) { await DB.del(el.dataset.id); toast('Grabación borrada'); rerender(); } },
  /* Biblioteca */
  embed(el) {
    const r = RES(el.dataset.id); const slot = $('[data-embed="' + r.id + '"]'); if (!slot) return;
    if (navigator.onLine === false) return toast('Requiere conexión');
    slot.innerHTML = '<div style="position:relative;padding-top:56.25%;margin-top:8px;border-radius:12px;overflow:hidden;background:#000"><iframe src="' + esc(r.embed) + '" title="' + esc(r.title) + '" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div><p class="xs muted mt8">Si no se reproduce aquí, usa «Abrir vídeo».</p>';
    el.remove();
  }
};
function pbCollect() {
  const pb = UI.pb; if (!pb) return;
  $$('[data-pb]').forEach(i => pb.d[i.dataset.pb] = i.value);
  $$('[data-pbi]').forEach(i => pb.d.ideas[+i.dataset.pbi][i.dataset.f] = i.value);
  S.pbDraft = pb;
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  try { S = mergeState(S); } catch (e) {}
  applyTheme();
  $('#tabs').innerHTML = TABS.map(t => '<li><a href="' + t.href + '" data-tab="' + t.id + '"><span class="tb-ic">' + icon(t.icon) + '</span>' + t.label + '</a></li>').join('');
  $('#btnSettings').innerHTML = icon('gear'); $('#btnCoach').innerHTML = icon('coach');
  $('#btnSettings').addEventListener('click', openSettings);
  $('#btnCoach').addEventListener('click', () => Router.go('#/coach'));
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]'); if (!el) return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName !== 'A') ev.preventDefault();
    try { fn(el, ev); } catch (e) { console.error(e); toast('No se pudo completar la acción'); }
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.dataset.in === 'phraseQ') { UI.phraseQ = t.value; const q = t.value.toLowerCase(); const list = BANK.phrases.filter(p => (UI.phraseCat === 'todas' || p.cat === UI.phraseCat) && (!q || (p.text + ' ' + (p.note || '')).toLowerCase().includes(q))); const box = $('#phList'); if (box) box.innerHTML = phraseItems(list); }
    if (t.dataset.in === 'trQ') { UI.trQ = t.value; const pos = t.selectionStart; rerender(); const n = $('[data-in="trQ"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } }
    if (t.dataset.in === 'headline') { UI.synth.headline = t.value; const c = $('#hlCount'); if (c) { const w = words(t.value); c.textContent = w + '/15'; c.style.color = w > 15 ? 'var(--bad)' : ''; } }
    if (t.id === 'setName') { S.name = t.value.trim().slice(0, 40); save(); }
    if ((t.dataset.pb || t.dataset.pbi) && UI.pb) { pbCollect(); save(); }
    if (t.dataset.pb === 'msg') { const c = $('#pbMsgCount'); if (c) { const w = words(t.value); c.textContent = w + ' palabras' + (w > 25 ? ' · demasiado largo' : ''); } }
  });
  document.addEventListener('change', ev => { if (ev.target.id === 'importFile' && ev.target.files[0]) doImport(ev.target.files[0]); });
  $('#sheetBack').addEventListener('click', ev => { if (ev.target.id === 'sheetBack') { if (Sheet._res) ACT.sheetNo(); else Sheet.close(); } });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') { if (Sheet.isOpen()) { if (Sheet._res) ACT.sheetNo(); else Sheet.close(); } else if ($('#overlay').classList.contains('open')) Practice.close(); }
  });
  window.addEventListener('scroll', () => $('#topbar').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  window.addEventListener('hashchange', () => Router.render());
  window.addEventListener('popstate', () => {
    if (Practice.ignorePop) { Practice.ignorePop = false; return; }
    if ($('#overlay').classList.contains('open')) {
      if (Practice.phase === 'prep' || Practice.phase === 'run' || (Practice.phase === 'review' && Practice.rec)) { try { history.pushState({ ov: 1 }, ''); Practice.pushed = true; } catch (e) {} Practice.close(); }
      else { Practice.pushed = false; Practice.close(true, true); }
    }
  });
  window.addEventListener('online', () => { if (/biblioteca/.test(location.hash)) rerender(); });
  window.addEventListener('offline', () => { if (/biblioteca/.test(location.hash)) rerender(); });
  if (!location.hash && S.route && S.route !== '#/hoy') { history.replaceState(null, '', S.route); }
  Router.render();
  DB.open();
  Milestones.check();
}
init();

</script>
</body>
</html>
